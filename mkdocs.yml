site_name: Andy's Technical Notes
theme:
  name: material
  language: zh-TW
  font:
    text: Noto Serif TC
    text_weight: 400
    code: Roboto Mono
  custom_dir: docs/overrides
  icon:
    logo: material/server-network
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切換至深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切換至淺色模式
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - overrides/extra.css
nav:
  - 首頁: index.md
  - 儲存系統: 
    - PowerStore: storage/powerstore.md
    - Unity: storage/unity.md
    - PoweStore CLI安裝: storage/pstcli.md
  - 虛擬化平台:
    - VMWare: vmware.md
    - PVE: pve.md
  - Dell CSM:
    - PowerStore CSI: csm/pstcsi.md
    - Unity CSI: csm/unitycsi.md

