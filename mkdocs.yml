site_name: Andy's Technical Notes
use_directory_urls: false
theme:
  name: material
  language: zh-TW
  font:
    text: Noto Serif TC
    text_weight: 400
    code: Roboto Mono
  custom_dir: docs/overrides
  icon:
    logo: material/server-network
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切換至深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切換至淺色模式
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - overrides/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Home: index.md
  - PowerStore: 
    - PSTCLI安裝: pst/pstcli.md
    - PST Replication: pst/pstrep.md
    - PST Log收集: pst/collection.md
  - GRAID: 
    - GRAID技術公告: graid/graid.md
    - SupremeRAID AE安裝: graid/aeinstall.md
    - MPS Deployment: graid/mps.md
    - GRAID Log收集: graid/collection.md
  - OCP: 
    - Harbor 安裝: ocp/harbor.md
    - OCP SNO 安裝: ocp/snoinstall.md
  - AI: 
    - NemoClaw安裝: ai/nemoclaw.md
