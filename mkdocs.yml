site_name: Andy's Technical Notes
theme:
  name: material
  language: zh-TW
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切換至深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切換至淺色模式
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.integrate
extra_css:
  - overrides/extra.css
nav:
  - 首頁: index.md
  - 儲存系統: storage.md
  - 虛擬化平台: virtualization.md
  - Dell CSM: csm.md

